# Push to main → build the static export → wrangler deploy to the `takehomepal` Worker.
# Stands in for Cloudflare's dashboard-only Git integration (its API-created build configs don't run;
# see Ship/AGENTS.md, 2026-09-28). Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Check build output
        run: |
          test -f out/index.html
          test -f out/sitemap.xml
          test -f out/1099-tax-calculator/index.html
          n=$(find out/paycheck-calculator -mindepth 2 -name index.html | wc -l)
          echo "state pages: $n"
          test "$n" -ge 9

      - name: Write deploy marker
        run: mkdir -p out/.well-known && echo "$GITHUB_SHA" > out/.well-known/deploy.txt

      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live deploy marker
        run: |
          for i in 1 2 3 4 5 6; do
            live=$(curl -s "https://takehomepal.com/.well-known/deploy.txt?ci=$GITHUB_RUN_ID-$i" | tr -d '\n')
            [ "$live" = "$GITHUB_SHA" ] && echo "live = $live" && exit 0
            sleep 10
          done
          echo "live marker '$live' != $GITHUB_SHA"; exit 1
